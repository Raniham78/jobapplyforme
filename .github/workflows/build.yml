name: build

on:
  push:
  pull_request:

jobs:
  dotnet-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore .\JobPilot.sln
      - run: dotnet build .\JobPilot.sln --configuration Release --no-restore
